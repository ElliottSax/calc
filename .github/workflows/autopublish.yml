name: Autopublish

# Self-publishing: every 2h a scheduled run moves one queued article from
# article-queue/ into the site's content dir and pushes it (triggers Vercel).
on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours = 12x/day
  workflow_dispatch:
    inputs:
      count:
        description: 'articles to publish this run'
        default: '1'

permissions:
  contents: write

concurrency:
  group: autopublish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Publish next article(s) from queue
        run: node scripts/queue-publish.mjs
        env:
          ARTICLES_PER_RUN: ${{ github.event.inputs.count || '1' }}

      - name: Stop early if the queue produced nothing
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: npm ci

      # THE GATE. These commits trigger a Vercel deploy, and the articles are MDX
      # compiled at build time -- a malformed one breaks the whole site build, not
      # just its own page.
      #
      # The sibling cardclassroom repo ran without this and pushed 85 articles
      # between 2026-08-12 and 2026-08-19 while every build failed on a syntax
      # error. The workflow went green each time because it never compiled
      # anything, so nobody noticed the site had stopped updating.
      #
      # If the build fails the job stops here and nothing is pushed.
      - name: Build must pass before anything is pushed
        if: steps.changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Commit & push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "autopublish[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: autopublish article"
          git push
